name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build packages and client bundle
        env:
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID || '1573451265709711552' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://cwmmaqlcqfrbawhmzrfb.supabase.co' }}
          VITE_SUPABASE_HOST: ${{ vars.VITE_SUPABASE_HOST || 'cwmmaqlcqfrbawhmzrfb.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__6wVzKZrsLmypOPgGw87Hw_NYD0Jj0y' }}
        run: pnpm build
