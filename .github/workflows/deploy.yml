name: CI & Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build packages and client bundle
        env:
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID || secrets.VITE_DISCORD_CLIENT_ID || '1573451265709711552' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://cwmmaqlcqfrbawhmzrfb.supabase.co' }}
          VITE_SUPABASE_HOST: ${{ vars.VITE_SUPABASE_HOST || secrets.VITE_SUPABASE_HOST || 'cwmmaqlcqfrbawhmzrfb.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__6wVzKZrsLmypOPgGw87Hw_NYD0Jj0y' }}
        run: pnpm build

      - name: Deploy Worker + static assets to Cloudflare
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret in GitHub Actions. Add it in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -n "${CF_ACCOUNT_ID_SECRET:-}" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID_SECRET"
          fi
          pnpm --filter @w20-vtt/edge deploy
